# BYOL Pretraining with ResNet-18
name: byol_resnet18
arch: resnet18
ssl_method: byol
mode: pretrain
epochs: 200
batch_size: 256

optimizer: adamw
optimizer_params:
  lr: 3e-4
  weight_decay: 1e-4

scheduler: cosine
scheduler_params:
  T_max: 200
  eta_min: 1e-6

projection_dim: 256
hidden_dim: 4096
momentum: 0.996