# SimCLR Pretraining with ResNet-50
name: simclr_resnet50
arch: resnet50
ssl_method: simclr
mode: pretrain
epochs: 200
batch_size: 256

optimizer: adamw
optimizer_params:
  lr: 3e-4
  weight_decay: 1e-4
  betas: [0.9, 0.999]

scheduler: cosine
scheduler_params:
  T_max: 200
  eta_min: 1e-6

# SSL-specific params
projection_dim: 256
temperature: 0.07