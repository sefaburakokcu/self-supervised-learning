# Linear Probing: SimCLR pretrained ResNet-50
name: simclr_resnet50_lp
arch: resnet50
ssl_method: simclr
pretrained_method: simclr_resnet50
mode: finetune
finetune_epochs: 100
batch_size: 256
linear_probe: true

optimizer: sgd
optimizer_params:
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0

scheduler: step
scheduler_params:
  step_size: 50
  gamma: 0.1