# Linear Probing: SimCLR pretrained ResNet-18
name: simclr_resnet18_lp
arch: resnet18
ssl_method: simclr
mode: finetune
pretrained_path: "./checkpoints/simclr_resnet18/best_model.pth"
finetune_epochs: 100
batch_size: 256
linear_probe: true

optimizer: sgd
optimizer_params:
  lr: 0.1
  momentum: 0.9
  weight_decay: 1e-4
  nesterov: true
  
scheduler: step
scheduler_params:
  step_size: 25
  gamma: 0.1
