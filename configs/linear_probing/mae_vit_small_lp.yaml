# Linear Probing: MAE pretrained ViT-Small
name: mae_vit_small_lp
arch: vit_small
ssl_method: mae
pretrained_method: mae_vit_small
mode: finetune
finetune_epochs: 100
batch_size: 256
linear_probe: true

optimizer: sgd
optimizer_params:
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0

scheduler: step
scheduler_params:
  step_size: 50
  gamma: 0.1