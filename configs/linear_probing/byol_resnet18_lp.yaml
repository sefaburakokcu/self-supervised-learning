# Linear Probing: BYOL pretrained ResNet-18
name: byol_resnet18_lp
arch: resnet18
ssl_method: byol
pretrained_method: byol_resnet18
mode: finetune
finetune_epochs: 100
batch_size: 256
linear_probe: true

optimizer: adam
optimizer_params:
  lr: 0.001
  weight_decay: 0.0

scheduler: cosine
scheduler_params:
  T_max: 100
  eta_min: 1e-6