# Global defaults
defaults:
  device: cuda
  use_wandb: false
  seed: 42
  num_workers: 4
  data_dir: ./datasets

# ============================================================================
# BASELINE EXPERIMENTS (No SSL, train from scratch)
# ============================================================================

baseline_experiments:
  baseline_resnet18:
    arch: resnet18
    mode: finetune
    finetune_epochs: 100
    batch_size: 128
    optimizer: sgd
    optimizer_params:
      lr: 0.1
      momentum: 0.9
      weight_decay: 1e-4
    scheduler: step
    scheduler_params:
      step_size: 30
      gamma: 0.1
    use_imagenet: false
    linear_probe: false

  baseline_resnet50:
    arch: resnet50
    mode: finetune
    finetune_epochs: 100
    batch_size: 128
    optimizer: sgd
    optimizer_params:
      lr: 0.1
      momentum: 0.9
      weight_decay: 1e-4
    scheduler: step
    scheduler_params:
      step_size: 30
      gamma: 0.1
    use_imagenet: false
    linear_probe: false

  baseline_vit_small:
    arch: vit_small
    mode: finetune
    finetune_epochs: 100
    batch_size: 128
    optimizer: sgd
    optimizer_params:
      lr: 0.01
      momentum: 0.9
      weight_decay: 1e-4
    scheduler: step
    scheduler_params:
      step_size: 30
      gamma: 0.1
    use_imagenet: false
    linear_probe: false

# ============================================================================
# SSL PRETRAINING EXPERIMENTS
# ============================================================================

ssl_pretraining_experiments:
  simclr_resnet18:
    arch: resnet18
    ssl_method: simclr
    mode: pretrain
    epochs: 200
    batch_size: 256
    optimizer: adamw
    optimizer_params:
      lr: 3e-4
      weight_decay: 1e-4
      betas: [0.9, 0.999]
    scheduler: cosine
    scheduler_params:
      T_max: 200
      eta_min: 1e-6
    # SSL-specific params
    projection_dim: 128
    temperature: 0.5

  moco_resnet18:
    arch: resnet18
    ssl_method: moco
    mode: pretrain
    epochs: 200
    batch_size: 256
    optimizer: adamw
    optimizer_params:
      lr: 3e-4
      weight_decay: 1e-4
    scheduler: cosine
    scheduler_params:
      T_max: 200
      eta_min: 1e-6
    projection_dim: 256
    temperature: 0.2
    momentum: 0.99

  byol_resnet18:
    arch: resnet18
    ssl_method: byol
    mode: pretrain
    epochs: 200
    batch_size: 256
    optimizer: adamw
    optimizer_params:
      lr: 3e-4
      weight_decay: 1e-4
    scheduler: cosine
    scheduler_params:
      T_max: 200
      eta_min: 1e-6
    projection_dim: 256
    momentum: 0.996

  mae_vit_small:
    arch: vit_small
    ssl_method: mae
    mode: pretrain
    epochs: 200
    batch_size: 128
    optimizer: adamw
    optimizer_params:
      lr: 1.5e-4
      weight_decay: 0.05
    scheduler: cosine
    scheduler_params:
      T_max: 200
      eta_min: 1e-6
    decoder_dim: 512
    decoder_depth: 4
    mask_ratio: 0.75

# ============================================================================
# FINE-TUNING EXPERIMENTS (Linear Probing)
# ============================================================================

linear_probing_experiments:
  simclr_resnet18_lp:
    arch: resnet18
    ssl_method: simclr
    pretrained_method: simclr_resnet18
    mode: finetune
    finetune_epochs: 100
    batch_size: 256
    linear_probe: true
    optimizer: sgd
    optimizer_params:
      lr: 0.1
      momentum: 0.9
      weight_decay: 0.0
    scheduler: step
    scheduler_params:
      step_size: 50
      gamma: 0.1

  byol_resnet18_lp:
    arch: resnet18
    ssl_method: byol
    pretrained_method: byol_resnet18
    mode: finetune
    finetune_epochs: 100
    batch_size: 256
    linear_probe: true
    optimizer: adam
    optimizer_params:
      lr: 0.001
      weight_decay: 0.0
    scheduler: cosine
    scheduler_params:
      T_max: 100
      eta_min: 1e-6

  mae_vit_small_lp:
    arch: vit_small
    ssl_method: mae
    pretrained_method: mae_vit_small
    mode: finetune
    finetune_epochs: 100
    batch_size: 256
    linear_probe: true
    optimizer: sgd
    optimizer_params:
      lr: 0.01
      momentum: 0.9
      weight_decay: 0.0
    scheduler: step
    scheduler_params:
      step_size: 50
      gamma: 0.1

# ============================================================================
# FINE-TUNING EXPERIMENTS (Full Fine-tuning)
# ============================================================================

full_finetune_experiments:
  simclr_resnet18_ft:
    arch: resnet18
    ssl_method: simclr
    pretrained_method: simclr_resnet18
    mode: finetune
    finetune_epochs: 100
    batch_size: 64
    linear_probe: false
    optimizer: sgd
    optimizer_params:
      lr: 0.01
      momentum: 0.9
      weight_decay: 1e-4
    scheduler: step
    scheduler_params:
      step_size: 30
      gamma: 0.1

  byol_resnet18_ft:
    arch: resnet18
    ssl_method: byol
    pretrained_method: byol_resnet18
    mode: finetune
    finetune_epochs: 100
    batch_size: 64
    linear_probe: false
    optimizer: sgd
    optimizer_params:
      lr: 0.01
      momentum: 0.9
      weight_decay: 1e-4
    scheduler: step
    scheduler_params:
      step_size: 30
      gamma: 0.1

  mae_vit_small_ft:
    arch: vit_small
    ssl_method: mae
    pretrained_method: mae_vit_small
    mode: finetune
    finetune_epochs: 100
    batch_size: 64
    linear_probe: false
    optimizer: adam
    optimizer_params:
      lr: 0.001
      weight_decay: 1e-4
    scheduler: cosine
    scheduler_params:
      T_max: 100
      eta_min: 1e-6

# ============================================================================
# TRANSFER LEARNING (ImageNet Pretraining)
# ============================================================================

transfer_learning_experiments:
  imagenet_resnet18:
    arch: resnet18
    mode: finetune
    finetune_epochs: 100
    batch_size: 64
    use_imagenet: true
    linear_probe: false
    optimizer: sgd
    optimizer_params:
      lr: 0.01
      momentum: 0.9
      weight_decay: 1e-4
    scheduler: step
    scheduler_params:
      step_size: 30
      gamma: 0.1

  imagenet_resnet50:
    arch: resnet50
    mode: finetune
    finetune_epochs: 100
    batch_size: 64
    use_imagenet: true
    linear_probe: false
    optimizer: sgd
    optimizer_params:
      lr: 0.01
      momentum: 0.9
      weight_decay: 1e-4
    scheduler: step
    scheduler_params:
      step_size: 30
      gamma: 0.1

# ============================================================================
# EXPERIMENT GROUPS (for easy batch execution)
# ============================================================================

experiment_groups:
  all_baselines:
    - baseline_resnet18
    - baseline_resnet50
    - baseline_vit_small

  all_ssl_pretrain:
    - simclr_resnet18
    - moco_resnet18
    - byol_resnet18
    - mae_vit_small

  all_linear_probing:
    - simclr_resnet18_lp
    - byol_resnet18_lp
    - mae_vit_small_lp

  all_full_finetune:
    - simclr_resnet18_ft
    - byol_resnet18_ft
    - mae_vit_small_ft

  all_transfer_learning:
    - imagenet_resnet18
    - imagenet_resnet50

  complete_pipeline:
    - baseline_resnet18
    - simclr_resnet18
    - simclr_resnet18_lp
    - simclr_resnet18_ft