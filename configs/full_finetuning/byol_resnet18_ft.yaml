# Full Fine-tuning: BYOL pretrained ResNet-18
name: byol_resnet18_ft
arch: resnet18
ssl_method: byol
pretrained_method: byol_resnet18
mode: finetune
finetune_epochs: 100
batch_size: 64
linear_probe: false

optimizer: sgd
optimizer_params:
  lr: 0.01
  momentum: 0.9
  weight_decay: 1e-4

scheduler: step
scheduler_params:
  step_size: 30
  gamma: 0.1