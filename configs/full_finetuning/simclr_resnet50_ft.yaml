# Full Fine-tuning: SimCLR pretrained ResNet-50
name: simclr_resnet50_ft
arch: resnet50
ssl_method: simclr
pretrained_method: simclr_resnet50
mode: finetune
finetune_epochs: 100
batch_size: 256
linear_probe: false

optimizer: sgd
optimizer_params:
  lr: 0.01
  momentum: 0.9
  weight_decay: 1e-4

scheduler: step
scheduler_params:
  step_size: 25
  gamma: 0.1