# Full Fine-tuning: MAE pretrained ViT-Small
name: mae_vit_small_ft
arch: vit_small
ssl_method: mae
pretrained_method: mae_vit_small
mode: finetune
finetune_epochs: 100
batch_size: 64
linear_probe: false

optimizer: adam
optimizer_params:
  lr: 0.001
  weight_decay: 1e-4

scheduler: cosine
scheduler_params:
  T_max: 100
  eta_min: 1e-6