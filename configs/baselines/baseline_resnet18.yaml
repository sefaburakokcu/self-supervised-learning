# Baseline ResNet-18 from scratch
name: baseline_resnet18
arch: resnet18
mode: scratch
finetune_epochs: 200
batch_size: 256

optimizer: sgd
optimizer_params:
  lr: 0.01
  momentum: 0.9
  weight_decay: 1e-4

scheduler: step
scheduler_params:
  step_size: 25
  gamma: 0.3

use_imagenet: false
linear_probe: false
