    - baselines/baseline_resnet18
    - baselines/baseline_resnet50
    - baselines/baseline_vit_small

  all_ssl_pretrain:
    - ssl_pretraining/simclr_resnet18
    - ssl_pretraining/moco_resnet18
    - ssl_pretraining/byol_resnet18
